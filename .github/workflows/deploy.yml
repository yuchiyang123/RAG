name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: [self-hosted, linux, rag]
    steps:
      - name: Pull latest
        run: git -C ~/projects/RAG pull --ff-only
      - name: Build & deploy via Docker
        run: |
          cd ~/projects/RAG
          docker compose up -d --build
          docker image prune -f